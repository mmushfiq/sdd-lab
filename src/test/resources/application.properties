# Replaces the main application.properties in tests: no datasource URL, so each test context
# gets its own in-memory H2 database
spring.application.name=hrs
# Booking confirmation email (002 research R4); a failed send is logged, the booking stays
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
hrs.mail.from=reservations@hotel.example
