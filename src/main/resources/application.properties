vaadin.launch-browser=true
spring.application.name=hrs
# Data survives restarts (plan: Storage); tests use src/test/resources/application.properties (in-memory)
spring.datasource.url=jdbc:h2:file:./data/hrs
# Booking confirmation email (002 research R4); a failed send is logged, the booking stays
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
hrs.mail.from=reservations@hotel.example
